<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="t d">
  <title id="t">RePaint resample sweep</title>
  <desc id="d">Valid-complex yield rises monotonically from 1.16% at r=1 to 5.20% at r=20; r=5 is the chosen working point.</desc>
  <rect x="0" y="0" width="640" height="380" fill="#ffffff"/>

  <text x="320" y="24" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e293b">RePaint sweep: valid-complex yield vs resampling r</text>
  <line x1="60" y1="314.0" x2="612" y2="314.0" stroke="#e2e8f0" stroke-width="1"/>
  <text x="52" y="318.0" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b">0%</text>
  <line x1="60" y1="269.3" x2="612" y2="269.3" stroke="#e2e8f0" stroke-width="1"/>
  <text x="52" y="273.3" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b">1%</text>
  <line x1="60" y1="224.7" x2="612" y2="224.7" stroke="#e2e8f0" stroke-width="1"/>
  <text x="52" y="228.7" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b">2%</text>
  <line x1="60" y1="180.0" x2="612" y2="180.0" stroke="#e2e8f0" stroke-width="1"/>
  <text x="52" y="184.0" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b">3%</text>
  <line x1="60" y1="135.3" x2="612" y2="135.3" stroke="#e2e8f0" stroke-width="1"/>
  <text x="52" y="139.3" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b">4%</text>
  <line x1="60" y1="90.7" x2="612" y2="90.7" stroke="#e2e8f0" stroke-width="1"/>
  <text x="52" y="94.7" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b">5%</text>
  <line x1="60" y1="46.0" x2="612" y2="46.0" stroke="#e2e8f0" stroke-width="1"/>
  <text x="52" y="50.0" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b">6%</text>
  <rect x="94.5" y="262.2" width="69.0" height="51.8" rx="3" fill="#2563eb"/>
  <text x="129.0" y="244.2" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">1.16%</text>
  <text x="129.0" y="258.2" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#64748b">29/2500</text>
  <text x="129.0" y="332.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1e293b">r=1</text>
  <rect x="232.5" y="162.1" width="69.0" height="151.9" rx="3" fill="#d97706"/>
  <text x="267.0" y="144.1" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">3.40%</text>
  <text x="267.0" y="158.1" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#64748b">85/2500</text>
  <text x="267.0" y="332.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1e293b">r=5</text>
  <text x="267.0" y="348.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#d97706">working point</text>
  <rect x="370.5" y="144.3" width="69.0" height="169.7" rx="3" fill="#2563eb"/>
  <text x="405.0" y="126.3" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">3.80%</text>
  <text x="405.0" y="140.3" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#64748b">57/1500</text>
  <text x="405.0" y="332.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1e293b">r=10</text>
  <rect x="508.5" y="81.7" width="69.0" height="232.3" rx="3" fill="#2563eb"/>
  <text x="543.0" y="63.7" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">5.20%</text>
  <text x="543.0" y="77.7" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#64748b">39/750</text>
  <text x="543.0" y="332.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1e293b">r=20</text>
  <text x="16" y="180" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1e293b" transform="rotate(-90 16 180)">valid / attempts</text>
</svg>
