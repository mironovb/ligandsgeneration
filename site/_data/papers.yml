# --- The three Kulik-group papers (Prof. Jiang's reading list) ---
- key: "toney2025pnas"
  group: "kulik"
  authors: "Toney, J. W.; St. Michel, R. G.; Garrison, A. G.; Kevlishvili, I.; Kulik, H. J."
  title: "Graph neural networks for predicting metal–ligand coordination of transition metal complexes"
  venue: "PNAS 2025, 122, e2415658122 (preprint: ChemRxiv, DOI 10.26434/chemrxiv-2024-nzk5q)"
  doi: "10.1073/pnas.2415658122"
  url: "https://doi.org/10.1073/pnas.2415658122"
  software: "pydentate — https://github.com/hjkgrp/pydentate"
  note: "The predict-then-build exemplar: predict CN + donor atoms from SMILES, then build a DFT-realistic 3D complex. The methodological model for Track B (but d-block, CN ≤ 6 only)."

- key: "kevlishvili2023jpclett"
  group: "kulik"
  authors: "Kevlishvili, I.; Duan, C.; Kulik, H. J."
  title: "Classification of Hemilabile Ligands Using Machine Learning"
  venue: "J. Phys. Chem. Lett. 2023, 14, 11100–11109"
  doi: "10.1021/acs.jpclett.3c02828"
  url: "https://doi.org/10.1021/acs.jpclett.3c02828"
  software: ""
  note: "Denticity is dynamic, not a fixed per-ligand lookup; the 2nd–4th coordination spheres matter — both indict any locally-reasoning generator."

- key: "toney2025jacs"
  group: "kulik"
  authors: "Toney, J. W.; St. Michel, R. G.; Garrison, A. G.; Kevlishvili, I.; Kulik, H. J."
  title: "Identifying Dynamic Metal–Ligand Coordination Modes with Ensemble Learning"
  venue: "JACS 2025, 147, 48218–48234"
  doi: "10.1021/jacs.5c17169"
  url: "https://doi.org/10.1021/jacs.5c17169"
  software: "pydentate + pydentate Lite — https://molsimplify.mit.edu/pydentate.html"
  note: "Predicts all plausible coordination modes end-to-end from one SMILES; names the limitation of our model's lineage (generators 'assuming a constant coordination mode')."
