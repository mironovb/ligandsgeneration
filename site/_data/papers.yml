# =============================================================================
# papers.yml — reference list. Rendered on background.md, grouped by `group`.
#
# Schema (fields per row):
#   key:      short citation key used in pages (e.g. "toney2025pnas")
#   group:    background | reference | method | kulik   (controls grouping on the page)
#   authors:  author string
#   title:    paper / software title
#   venue:    journal, year, volume, pages
#   doi:      bare DOI (e.g. 10.1073/pnas.2415658122), or "" if none given in sources
#   url:      canonical link, or "" if none given in sources
#   software: associated code/tool, or ""
#   note:     one-line relevance to this project, or ""
#
# DOIs/URLs are included ONLY where they appear in PROJECT_OVERVIEW.md or
# LITERATURE_AND_STRATEGY.md; blanks are intentional (not invented).
# =============================================================================

