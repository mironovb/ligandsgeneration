# --- The reference complex used in every generation experiment ---
- key: "kravchuk2024ejic"
  group: "reference"
  authors: "Kravchuk, D. et al."
  title: "Eu(TMMA)₂(NO₃)₃ — TMMA = N,N,N',N'-tetramethylmalonamide"
  venue: "Eur. J. Inorg. Chem. (EurJIC), 2024"
  doi: "10.1002/ejic.202300632"
  url: "https://doi.org/10.1002/ejic.202300632"
  software: "CCDC VEDTAA01 / deposit 2296300"
  note: "Standard reference complex: Eu center, 2 TMMA + 3 nitrate = 5 ligands, CN 10, 35 heavy atoms, cis. A diamide chemically adjacent to diglycolamide separations extractants."

# --- Generative-modeling methods (the base model and the techniques it uses) ---
- key: "liganddiff"
  group: "method"
  authors: "Jin, H.; Merz, K. M."
  title: "multi-LigandDiff — 3D diffusion generation of metal-complex ligands (builds on LigandDiff, 2023)"
  venue: "J. Chem. Theory Comput. (JCTC), 2024"
  doi: "10.1021/acs.jctc.4c00775"
  url: "https://doi.org/10.1021/acs.jctc.4c00775"
  software: "multi_LigandDiff (this project's base model)"
  note: "The base architecture adapted to lanthanides here (ligand_node_nf 7 → 11, zero-padded TM weights). Originally d-block, CN ≤ 6 only."

- key: "edm"
  group: "method"
  authors: "Hoogeboom, E. et al."
  title: "Equivariant Diffusion for Molecule Generation in 3D (EDM)"
  venue: "ICML 2022"
  doi: ""
  url: ""
  software: ""
