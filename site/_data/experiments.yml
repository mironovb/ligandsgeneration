# =============================================================================
# experiments.yml — one entry per sbatch run. Rendered as a table on
# experiment-log.md. Populated from VERIFICATION_REPORT.md §5 ("Completed
# sbatches") + §2/§3/§4. Account is `general` throughout.
#
# Schema (fields per row):
#   job_id:     SLURM job id(s) as a string (may list several, space-separated)
#   sbatch:     submission script filename
#   job_name:   SLURM -J name ("" if not recorded)
#   partition:  SLURM -p partition(s)
#   date:       run date YYYY-MM-DD if logged, else "" (NOT guessed)
#   gpu_hours:  approx GPU-hours, filled only where a wall window/4 h cap is logged
#   phase:      setup | training | generation | xtb | sweep | design | not-run
#   status:     completed-clean | completed | timed-out | errored | incomplete | not-run
#   outcome:    one-line human-readable result
#   key_result: headline number / artifact produced
#   notes:      caveats / artifact paths / provenance
#
# --- HOW TO APPEND A NEW RUN (living-tracker mechanism) -----------------------
# When a future sbatch finishes: copy one block below, fill every field from the
# job's .out/.err log (job id, partition, the line that prints the result), set
# `status`, and put the headline number in `key_result`. Keep `date` "" unless
# the log prints it. Then add a dated line to changelog.md. The table on
# experiment-log.md re-renders automatically — no other edits needed.
# =============================================================================

